<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today — Morning Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #101c2c;
    --navy-2: #17253a;
    --navy-3: #1e2e46;
    --parchment: #f3eee3;
    --amber: #e8a33d;
    --coral: #d9694f;
    --teal: #4c9d87;
    --lilac: #9b8ccb;
    --sky: #6ea8d8;
    --muted: #7c8aa0;
    --hairline: rgba(243, 238, 227, 0.10);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--navy); color: var(--parchment); font-family: 'Inter', sans-serif; min-height: 100vh; }
  .dawn-bar { height: 3px; width: 100%; background: linear-gradient(90deg, var(--navy) 0%, var(--coral) 25%, var(--amber) 50%, var(--teal) 75%, var(--navy) 100%); background-size: 200% 100%; animation: sweep 8s linear infinite; }
  @keyframes sweep { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
  @media (prefers-reduced-motion: reduce) { .dawn-bar { animation: none; } }
  .wrap { max-width: 700px; margin: 0 auto; padding: 48px 24px 80px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid var(--hairline); padding-bottom: 28px; margin-bottom: 40px; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); margin: 0 0 10px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(32px, 8vw, 44px); margin: 0; line-height: 1.05; }
  .subtitle { color: var(--muted); font-size: 14px; margin-top: 8px; }
  #refreshBtn { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.03em; background: transparent; color: var(--parchment); border: 1px solid var(--hairline); padding: 11px 18px; border-radius: 3px; cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease; white-space: nowrap; }
  #refreshBtn:hover { border-color: var(--amber); background: rgba(232,163,61,0.06); }
  #refreshBtn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  #refreshBtn:disabled { opacity: 0.5; cursor: default; }

  .card { border-bottom: 1px solid var(--hairline); padding: 24px 0; display: grid; grid-template-columns: 28px 1fr; gap: 14px; }
  .card:last-child { border-bottom: none; }
  .rank { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); padding-top: 4px; }
  .tag { display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; margin-bottom: 10px; border: 1px solid var(--hairline); }
  .tag.world { color: var(--coral); border-color: var(--coral); }
  .tag.business { color: var(--amber); border-color: var(--amber); }
  .tag.tech { color: var(--teal); border-color: var(--teal); }
  .tag.science { color: var(--sky); border-color: var(--sky); }
  .tag.culture { color: var(--lilac); border-color: var(--lilac); }

  .headline { font-family: 'Fraunces', serif; font-size: 19px; line-height: 1.32; margin: 0 0 8px; color: var(--parchment); text-decoration: none; display: block; }
  .headline:hover { color: var(--amber); }
  .why { font-size: 14.5px; color: #c9d0dc; line-height: 1.6; margin: 0 0 8px; }
  .meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }

  .status { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); padding: 40px 0; text-align: center; line-height: 1.8; }
  .status .err { color: var(--coral); }

  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--hairline); font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  .skeleton { height: 68px; border-radius: 3px; background: linear-gradient(90deg, var(--navy-2) 0%, var(--navy-3) 50%, var(--navy-2) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease infinite; margin-bottom: 18px; }
  @keyframes shimmer { 0% { background-position: 0% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body>

<div class="dawn-bar"></div>

<div class="wrap">
  <header>
    <div>
      <p class="eyebrow" id="dateLine">—</p>
      <h1>Today</h1>
      <p class="subtitle">The 8 stories that actually matter, explained simply</p>
    </div>
    <button id="refreshBtn">↻ Refresh</button>
  </header>

  <div id="content">
    <div class="status">Pulling today's headlines…</div>
  </div>

  <footer>
    <span id="updatedLine">Not yet loaded</span>
    <span>Sources: BBC, NPR, Dow Jones, TechCrunch, VentureBeat</span>
  </footer>
</div>

<script>
const dateLine = document.getElementById('dateLine');
const updatedLine = document.getElementById('updatedLine');
const content = document.getElementById('content');
const refreshBtn = document.getElementById('refreshBtn');

const TAG_CLASS = {
  'World': 'world',
  'Business': 'business',
  'Tech & AI': 'tech',
  'Science': 'science',
  'Culture': 'culture'
};

function setDate() {
  const now = new Date();
  dateLine.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function renderStories(stories) {
  if (!stories || stories.length === 0) {
    content.innerHTML = '<p class="status">Nothing ranked today. Try refreshing.</p>';
    return;
  }
  content.innerHTML = stories.map((it, i) => `
    <div class="card">
      <div class="rank">${String(i + 1).padStart(2, '0')}</div>
      <div>
        <span class="tag ${TAG_CLASS[it.topic] || 'world'}">${escapeHtml(it.topic || 'News')}</span>
        <a class="headline" href="${it.link || '#'}" target="_blank" rel="noopener">${escapeHtml(it.title)}</a>
        <p class="why">${escapeHtml(it.why)}</p>
        <p class="meta">${escapeHtml(it.source || '')}</p>
      </div>
    </div>
  `).join('');
}

function renderSkeleton() {
  content.innerHTML = Array(6).fill('<div class="skeleton"></div>').join('');
}

function renderError(msg) {
  content.innerHTML = `<div class="status">
    <span class="err">Couldn't put today's briefing together.</span><br>
    ${escapeHtml(msg)}<br><br>
    Check that the server is running and GROQ_API_KEY is set, then refresh.
  </div>`;
}

async function loadBriefing(fresh = false) {
  refreshBtn.disabled = true;
  renderSkeleton();
  try {
    const res = await fetch('/api/briefing' + (fresh ? '?fresh=true' : ''));
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Server error');
    renderStories(data.stories);
    const when = data.generatedAt ? new Date(data.generatedAt) : new Date();
    updatedLine.textContent = (data.cached ? 'Cached · ' : 'Updated ') + when.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    renderError(e.message || 'Unknown error.');
  } finally {
    refreshBtn.disabled = false;
  }
}

refreshBtn.addEventListener('click', () => loadBriefing(true));
setDate();
loadBriefing(false);
</script>

</body>
</html>
